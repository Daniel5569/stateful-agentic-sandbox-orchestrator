name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  node-gateway:
    name: Node gateway
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sandbox_orchestrator
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: change-me-in-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchestrator -d sandbox_orchestrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://orchestrator:change-me-in-production@localhost:5432/sandbox_orchestrator
      REDIS_URL: redis://localhost:6379
      RUN_DB_INTEGRATION: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production and dev dependencies
        run: npm run audit

      - name: Test gateway
        run: npm test

      - name: Build gateway
        run: npm run build

  python-engine:
    name: Python engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test engine
        run: python -m pytest
