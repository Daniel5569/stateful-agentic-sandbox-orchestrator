[project]
name = "sandbox-engine"
version = "0.1.0"
description = "Async Python execution engine for the Stateful Agentic Sandbox Orchestrator."
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29.0",
  "fastapi>=0.111.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.4",
  "redis>=5.0.7",
  "uvicorn[standard]>=0.30.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.2",
  "pytest-asyncio>=0.23.7"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
